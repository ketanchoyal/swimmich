name: ImmichSwiftUI
options:
  bundleIdPrefix: app.immich
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
packages:
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: 16.1.0
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    GENERATE_INFOPLIST_FILE: NO
targets:
  ImmichSwiftUI:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Resources/TeslaCar.usdz
        buildPhase: resources
      # Third-party attribution (gap G23). XcodeGen enumerates resources one by
      # one, so a new folder is not copied until it is listed: without this the
      # Licenses screen cannot resolve a single file.
      - path: Resources/Acknowledgements
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Immich
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: "Immich needs Photos access to upload and back up your library."
        NSPhotoLibraryAddUsageDescription: "Immich needs Photos access to add uploaded assets."
        NSFaceIDUsageDescription: "PhotoVault uses Face ID to unlock the app."
        NSCameraUsageDescription: "Immich uses the camera to scan server configuration QR codes."
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        BGTaskSchedulerPermittedIdentifiers:
          - app.immich.background-backup
        UIBackgroundModes:
          - processing
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - app.immich
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.millianlmx.immich-ios
        DEVELOPMENT_TEAM: 2MJF39L8VY
        INFOPLIST_FILE: Resources/Info.plist
        # Keychain group shared with the widget extension (widgets-homescreen):
        # the app writes the widget session, the extension reads it. The group is
        # the app-id-derived one, so the app keeps writing with no explicit
        # access group and the extension lists that group to be allowed to read
        # it. The entitlements files must stay comment-free: Xcode re-serialises
        # them during the build, and the build fails if its input changed.
        CODE_SIGN_ENTITLEMENTS: Resources/ImmichSwiftUI.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: ImmichSharedKit
        embed: true
      - target: ImmichWidgets
        embed: true
      - package: SocketIO
        product: SocketIO
  ImmichSharedKit:
    type: framework
    platform: iOS
    sources:
      - path: Sources/ImmichSharedKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.millianlmx.immich-ios.sharedkit
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
        SWIFT_VERSION: "5.9"
  ImmichWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ImmichWidgets
      # Same catalog as the app: widget copy is read out of the extension's own
      # bundle (`Bundle.main` inside the widget process is the extension), so
      # without this every widget string would fall back to English.
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
    info:
      path: ImmichWidgets/Info.plist
      properties:
        CFBundleDisplayName: Immich
        # Same versions as the containing app. xcodegen hardcodes 1.0/1 here
        # otherwise, and an extension whose version does not match its app is a
        # launch-and-store problem waiting to happen (the app ships 0.1.0).
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Same policy as the app, and for the same reason: a self-hosted Immich
        # is usually plain HTTP on the LAN, which App Transport Security blocks
        # in the extension process. Loopback is exempt from ATS, so a simulator
        # test against 127.0.0.1 never noticed (issue #19 follow-up).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.millianlmx.immich-ios.widgets
        DEVELOPMENT_TEAM: 2MJF39L8VY
        # Read side of the same sharing; see the app target's comment.
        CODE_SIGN_ENTITLEMENTS: Resources/ImmichWidgets.entitlements
    dependencies:
      - target: ImmichSharedKit
        embed: true
  ImmichSwiftUITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: ImmichSwiftUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.immich.swiftui.tests
        GENERATE_INFOPLIST_FILE: YES
  ImmichSwiftUIUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: ImmichSwiftUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.immich.swiftui.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ImmichSwiftUI
schemes:
  ImmichSwiftUI:
    build:
      targets:
        ImmichSwiftUI: all
        ImmichWidgets: all
        ImmichSwiftUITests: [test]
        ImmichSwiftUIUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ImmichSwiftUITests
        - ImmichSwiftUIUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
