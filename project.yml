name: ImmichSwiftUI
options:
  bundleIdPrefix: app.immich
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    GENERATE_INFOPLIST_FILE: NO
targets:
  ImmichSwiftUI:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources/Assets.xcassets
      - path: Resources/Info.plist
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Immich
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: "Immich needs Photos access to upload and back up your library."
        NSPhotoLibraryAddUsageDescription: "Immich needs Photos access to add uploaded assets."
        NSFaceIDUsageDescription: "PhotoVault uses Face ID to unlock the app."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.millianlmx.immich-ios
        DEVELOPMENT_TEAM: 2MJF39L8VY
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  ImmichSwiftUITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: ImmichSwiftUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.immich.swiftui.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ImmichSwiftUI:
    build:
      targets:
        ImmichSwiftUI: all
        ImmichSwiftUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ImmichSwiftUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
